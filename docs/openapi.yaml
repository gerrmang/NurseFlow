openapi: 3.1.0
info:
  title: NurseFlow Scheduling API
  version: 0.1.0
  description: |
    Android 앱과 반응형 웹이 공유하는 Kotlin/Spring Boot REST API.
    확정된 결정: 간호사는 병동 전체 공개표 또는 본인 공개표 조회, 미충원 표 공개 허용,
    관리자 확정 전 draft는 비공개, 관리자 confirm 성공 시 해당 revision을 활성 달력에 공개 적용.
    현재 구현은 Kakao 세션(/auth/*), 운영자 코드가 설정된 시연용 1회 첫 병동 생성(POST /wards),
    24시간 초대 발급·철회·수락과 팀·경력 프로필 API를 제공한다. 신규 제품 결정은
    docs/pre-breakdown-scope-2026-11-04.md를 따른다. 최초 관리자의 실제 병원 검색·선택과 병동명 자기 공간 생성,
    실제 병원 검색·선택과 병동명 자기 공간 생성, 관리자 확정 희망 오프는 아직 구현되지 않았다.
    Android는 Kakao SDK로 받은 ID 토큰을 /auth/kakao/session에 보내고 refresh token을 본문으로 주고받는다.
    웹은 /auth/web/* 경로로 서버가 state·nonce를 관리하는 인가 코드 교환을 하고 refresh token을 HttpOnly 쿠키로만 받는다.
    이후 모든 요청에는 NurseFlow가 발급한 access token을 사용한다. Kakao 토큰은 API bearer로 받지 않는다.
    가입 시 간호사는 병원 입사 연월(hospitalJoinedOn)을 제출한다. 실제 경력 시작 연월(careerStartedOn)과 직급은
    관리자가 설정한다. 팀별 드래그 순서가 상대 경력순을 정하며 병원 입사 연월보다 우선하는 기능은 아직 구현되지 않았다.
    팀별 수요·경력 구성 진단·관리자 허용형 팀 간 지원근무는 해당 기능 구현 전에 계약을 확장한다.
    추가 확정된 병원별 근무 시각·환산시간, 휴일 달력·월 목표시간, VY/SOF,
    Night 전담 3개월 순환, 연속근무 상한, 희망 오프·선임 최소 인원 계약도
    docs/monthly-roster-rules-and-two-person-plan.md를 기준으로 기능별 PR에서 설계한다.
    관리자 설정 입력 항목과 첨부 정책 조정은 docs/hospital-roster-policy-settings.md에 정리했지만,
    정책 설정 API/스키마는 아직 이 계약에 정의되거나 구현되지 않았다. 설정 API 기능 PR에서 추가한다.
servers:
  - url: /api/v1
    description: API base path (host is environment-specific)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Identity
  - name: Wards
  - name: Hospitals
  - name: Invitations
  - name: Staff
  - name: Rosters
  - name: Absences
  - name: Assignments
  - name: Generation
  - name: Published calendars
paths:
  /auth/kakao/session:
    post:
      tags: [Auth]
      operationId: loginWithKakao
      summary: Kakao ID 토큰으로 NurseFlow 세션 시작
      description: |
        서명(RS256, Kakao JWKS), iss, aud(허용된 Kakao 앱 키), exp, iat(10분 이내)를 검증한다.
        클라이언트가 인가 요청에 nonce를 썼다면 같은 값을 보내야 한다.
        로그인은 병동 권한을 주지 않는다. 처음 로그인한 사용자는 memberships가 비어 있다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 세션 발급 (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_ID_TOKEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE 또는 IDENTITY_PROVIDER_NOT_CONFIGURED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /auth/session/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 로그인 상태 유지 — refresh token 회전
      description: |
        성공 시 access/refresh token 쌍을 새로 발급하고 이전 refresh token은 사용할 수 없다.
        이미 교체·철회된 refresh token을 다시 쓰면 같은 세션 계열 전체를 철회한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 새 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_REFRESH_TOKEN — 다시 로그인 필요
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 로그아웃 — refresh token 세션 계열 철회 (멱등)
      description: 이미 발급된 access token은 만료(기본 10분)까지 유효하므로 클라이언트가 즉시 폐기한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: 로그아웃 완료
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/web/kakao/authorization:
    post:
      tags: [Auth]
      operationId: startWebKakaoLogin
      summary: 웹 Kakao 로그인 시작 — state·nonce 발급과 인가 주소 반환
      description: |
        웹 전용. 서버가 1회용 state·nonce를 만들어 저장하고(기본 10분), Kakao 인가 주소를 돌려준다.
        브라우저 결속용 `nf_kakao_login` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth/web)를 함께 설정한다.
        클라이언트는 응답의 authorizationUrl로 이동하기만 하고 state·nonce를 만들거나 저장하지 않는다.
        `redirectUri`는 서버 허용 목록(NURSEFLOW_KAKAO_REDIRECT_URIS)과 정확히 같아야 한다.
        웹 공통 요구: `X-NurseFlow-Client: web` 헤더가 있어야 하고, Origin 헤더가 있으면 허용 출처여야 한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebKakaoAuthorizationRequest'
      responses:
        '200':
          description: 인가 주소 (Cache-Control no-store, Set-Cookie nf_kakao_login)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebKakaoAuthorization'
        '400':
          description: INVALID_REQUEST 또는 INVALID_REDIRECT_URI
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: WEB_CLIENT_REQUIRED — 웹 헤더 누락, 허용되지 않은 Origin 또는 교차 사이트 요청(Sec-Fetch-Site cross-site)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: IDENTITY_PROVIDER_NOT_CONFIGURED — REST API 키 또는 Redirect URI 미설정
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /auth/web/kakao/code:
    post:
      tags: [Auth]
      operationId: completeWebKakaoLogin
      summary: 웹 Kakao 인가 코드 교환으로 NurseFlow 세션 시작
      description: |
        웹 전용. Kakao가 Redirect URI로 돌려준 `code`와 `state`를 보낸다.
        서버는 `nf_kakao_login` 쿠키와 state가 같은 로그인 시도인지, 만료·재사용되지 않았는지 확인하고 state를 즉시 소진한다.
        그 뒤 저장된 Redirect URI와 REST API 키(필요하면 client secret)로 Kakao 토큰 엔드포인트에서 코드를 교환하고,
        받은 ID 토큰을 `/auth/kakao/session`과 같은 규칙으로 검증하되 nonce는 서버가 저장한 값과 비교한다.
        Kakao access/refresh token은 저장하거나 기록하지 않는다.
        refresh token은 응답 본문에 넣지 않고 `nf_refresh` 쿠키(HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth/web)로만 준다.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebKakaoCodeRequest'
      responses:
        '200':
          description: 세션 발급 (Cache-Control no-store, Set-Cookie nf_refresh, nf_kakao_login 삭제)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            INVALID_LOGIN_STATE(쿠키 없음·state 불일치·만료·재사용), INVALID_AUTHORIZATION_CODE(Kakao가 코드 거부),
            INVALID_ID_TOKEN(서명·aud·nonce 등 검증 실패)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: WEB_CLIENT_REQUIRED — 웹 헤더 누락, 허용되지 않은 Origin 또는 교차 사이트 요청(Sec-Fetch-Site cross-site)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: IDENTITY_PROVIDER_UNAVAILABLE 또는 IDENTITY_PROVIDER_NOT_CONFIGURED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /auth/web/session/refresh:
    post:
      tags: [Auth]
      operationId: refreshWebSession
      summary: 웹 로그인 상태 유지 — 쿠키의 refresh token 회전
      description: |
        본문 없이 호출한다. `nf_refresh` 쿠키의 refresh token을 `/auth/session/refresh`와 같은 규칙으로 회전하고
        새 쿠키를 설정한다. 이미 교체·철회된 값을 다시 쓰면 세션 계열 전체를 철회한다.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebClientHeader'
      responses:
        '200':
          description: 새 세션 (Cache-Control no-store, Set-Cookie nf_refresh)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSession'
        '401':
          description: INVALID_REFRESH_TOKEN — 쿠키 없음·만료·재사용, 다시 로그인 필요
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '403':
          description: WEB_CLIENT_REQUIRED — 웹 헤더 누락, 허용되지 않은 Origin 또는 교차 사이트 요청(Sec-Fetch-Site cross-site)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /auth/web/logout:
    post:
      tags: [Auth]
      operationId: logoutWeb
      summary: 웹 로그아웃 — 쿠키 세션 계열 철회와 쿠키 삭제 (멱등)
      description: 본문 없이 호출한다. 쿠키가 없거나 이미 철회된 값이어도 204와 쿠키 삭제를 돌려준다.
      security: []
      parameters:
        - $ref: '#/components/parameters/WebClientHeader'
      responses:
        '204':
          description: 로그아웃 완료 (Set-Cookie nf_refresh Max-Age=0)
        '403':
          description: WEB_CLIENT_REQUIRED — 웹 헤더 누락, 허용되지 않은 Origin 또는 교차 사이트 요청(Sec-Fetch-Site cross-site)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: 로그인 사용자와 병동 membership 조회
      responses:
        '200':
          description: 사용자 세션 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /wards:
    get:
      tags: [Wards]
      operationId: listMyWards
      summary: 로그인 사용자가 접근 가능한 병동 목록
      responses:
        '200':
          description: 접근 가능한 병동
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WardMembership'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Wards]
      operationId: createWard
      summary: 병원을 골라 자기 병동을 만들고 관리자가 됨
      description: |
        로그인 사용자가 병원 검색(`GET /hospitals/search`) 결과에서 고른 병원과 병동명으로 새 병동을 만든다.
        호출자는 그 병동의 `WARD_ADMIN`이 되며 간호사 기록은 만들지 않는다. 병원 선택은 재직 인증이 아니다.
        클라이언트는 병원의 `source`·`externalId`만 보낸다. 서버가 복제된 공식 병원 목록에서 병원명·주소를 찾아
        생성 시점의 표시값으로 저장하므로 클라이언트가 병원명을 바꿔 보낼 수 없다.
        목록에 없거나 폐업으로 비활성화된 병원은 422 `HOSPITAL_NOT_FOUND`이며 직접 입력으로 만드는 경로는 없다.
        같은 병원·같은 병동명의 병동을 다른 관리자가 만들 수 있고, 서로의 병동에 권한이 생기지 않는다.
        같은 `Idempotency-Key`로 다시 보내면 처음 만든 병동을 그대로 돌려준다(재시도·중복 탭 대비).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWardRequest'
      responses:
        '201':
          description: 생성된 병동과 호출자의 관리자 소속
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 유효한 access token이 없거나(UNAUTHORIZED 계열) 토큰의 사용자가 없음(USER_NOT_FOUND, 다시 로그인)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: |
            IDEMPOTENCY_KEY_REUSED — 같은 키를 다른 요청 본문이나 다른 사용자가 사용함.
            WARD_ALREADY_CREATED — 같은 계정이 같은 병원·같은 병동명의 병동을 이미 만듦(새 키로 다시 보낸 이중 제출). 다른 관리자는 해당 없음.
            WARD_CREATION_LIMIT_REACHED — 한 계정이 만들 수 있는 병동 수(기본 5개)를 모두 사용함. 같은 키 재시도는 상한과 관계없이 처음 병동을 돌려준다.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: HOSPITAL_NOT_FOUND — 복제 목록에 없거나 비활성화된 병원
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '503':
          description: HOSPITAL_SEARCH_NOT_CONFIGURED — 서버에 병원 목록이 적재되지 않아 병원을 확인할 수 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /hospitals/search:
    get:
      tags: [Hospitals]
      operationId: searchHospitals
      summary: 병원 이름으로 공식 의료기관 검색
      description: |
        병동을 만들 때 병원을 고르기 위한 검색이다. 로그인 사용자면 누구나 호출할 수 있고 병원 단위 권한은 없다.
        서버는 건강보험심사평가원 「전국 병의원 및 약국 현황」(공공데이터포털, 분기 갱신)의 병·의원 목록을 서버 DB에 복제해 두고 검색한다.
        약국은 포함하지 않는다. 복제 목록 검색은 띄어쓰기·괄호·기호를 무시하고 이름 일부로 찾으며, 정렬은 정확 일치 → 병원급(상급종합·종합병원·
        병원·요양병원·정신병원·치과병원·한방병원) → 의원급, 같은 급에서는 앞부분 일치 → 포함 → 이름순이다.
        목록을 아직 적재하지 않은 서버는 같은 기관의 실시간 병원정보서비스 API로 대신 검색한다. 이 대체 경로는 응답에 10초 이상 걸릴 수 있고,
        검색어 일치 방식과 정렬은 외부 API를 따르므로 위의 기호 무시·정렬 규칙을 보장하지 않는다. 운영 서버는 복제 목록을 적재한다.
        병동 생성(`POST /wards`)은 복제 목록으로 병원을 확인하므로, 대체 경로로 찾은 병원으로는 목록이 적재될 때까지 병동을 만들 수 없다(503).
        결과가 없으면 200과 빈 `items`를 돌려준다. 실시간 API 장애·시간 초과·호출 한도 초과는 503 `HOSPITAL_SEARCH_UNAVAILABLE`이다.
        화면에는 응답의 `attribution`(데이터 기준 시점 포함)을 출처로 표시하고, 검색은 입력할 때마다가 아니라 검색 실행 시 호출한다.
      parameters:
        - name: query
          in: query
          required: true
          description: |
            병원 이름 일부. 앞뒤 공백을 제거한 뒤 2~50자, 제어 문자 불가.
            또한 띄어쓰기·괄호·기호를 뺀 문자·숫자가 2자 이상이어야 한다(예 `(가)`는 400). 두 검색 경로에 같이 적용한다.
          schema:
            type: string
            minLength: 2
            maxLength: 50
            example: 가상대학교병원
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: 검색 결과(없으면 빈 목록)
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HospitalSearchPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: |
            HOSPITAL_SEARCH_NOT_CONFIGURED — 병원 목록이 적재되지 않았고 실시간 API 키도 설정되지 않음.
            HOSPITAL_SEARCH_UNAVAILABLE — (목록 미적재 시) 실시간 API 장애·시간 초과·호출 한도 초과·응답 형식 오류.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /wards/{wardId}/invitations:
    parameters:
      - $ref: '#/components/parameters/WardId'
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: 관리자 초대 링크 발급
      description: |
        정확히 24시간 만료되는 1회용 초대를 만든다. token은 이 응답에서 한 번만 보여 주며
        서버에는 SHA-256 해시만 저장한다. inviteUrl은 서버에 링크 기본 주소가 설정된 경우에만 오며
        token은 URL fragment(#token=)에 붙는다. WARD_ADMIN 초대에는 nurseId를 넣을 수 없다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 발급된 초대 (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '400':
          description: INVALID_REQUEST(fieldErrors) 또는 INVALID_INVITATION
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: WARD_ADMIN_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '404':
          description: WARD_NOT_FOUND 또는 NURSE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: NURSE_ALREADY_LINKED 또는 INVITATION_ALREADY_PENDING
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: 병동 초대 목록 (token 미포함)
      responses:
        '200':
          description: 최근 발급순
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /wards/{wardId}/invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/WardId'
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: 미사용 초대 철회 (이미 철회된 초대는 204)
      responses:
        '204':
          description: 철회됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WARD_NOT_FOUND 또는 INVITATION_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: INVITATION_ALREADY_REDEEMED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /wards/{wardId}/invitations/{invitationId}/reissue:
    parameters:
      - $ref: '#/components/parameters/WardId'
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Invitations]
      operationId: reissueInvitation
      summary: 같은 역할·대상으로 초대 링크 재발급
      description: 이전 미사용 링크를 자동 철회하고 정확히 24시간 유효한 새 링크를 발급한다. 철회되었거나 이미 사용된 초대는 재발급할 수 없다.
      responses:
        '201':
          description: 새 링크 (Cache-Control no-store)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WARD_NOT_FOUND, INVITATION_NOT_FOUND 또는 NURSE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: INVITATION_ALREADY_REDEEMED, NURSE_ALREADY_LINKED 또는 INVITATION_ALREADY_PENDING
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '410':
          description: INVITATION_REVOKED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

