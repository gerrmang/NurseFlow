name: Verify

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  demo:
    name: Demo seed checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - uses: gradle/actions/setup-gradle@v6
      - name: Build isolated demo backend
        working-directory: backend
        run: ./gradlew bootJar --no-daemon
      - name: Check demo API, runtime and CLI failure recovery
        env:
          NURSEFLOW_B6_TEST_JAR: backend/build/libs/nurseflow-backend-0.1.0-SNAPSHOT.jar
        run: node --test scripts/demo/api.test.mjs scripts/demo/runtime.test.mjs scripts/demo/local.test.mjs
      - name: Verify fictional seed and two-account invitation flow
        run: node scripts/demo/local.mjs --jar backend/build/libs/nurseflow-backend-0.1.0-SNAPSHOT.jar --verify

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test backend
        working-directory: backend
        run: ./gradlew test --no-daemon

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build Android app
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check API types against docs/openapi.yaml
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test -- --run
      - name: Build
        run: npm run build
