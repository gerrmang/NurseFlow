spring:
  application:
    name: nurseflow-backend
  datasource:
    url: jdbc:h2:file:./nurseflow;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true

nurseflow:
  auth:
    kakao:
      issuer: https://kauth.kakao.com
      jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
      # Comma-separated Kakao app keys accepted as the ID token "aud" (Android native key, web key).
      audiences: ${NURSEFLOW_KAKAO_AUDIENCES:}
      # Web login (authorization code flow). The REST API key is the client_id and the ID token "aud".
      rest-api-key: ${NURSEFLOW_KAKAO_REST_API_KEY:}
      # Optional; only when "Client Secret" is enabled for the Kakao app. Never committed.
      client-secret: ${NURSEFLOW_KAKAO_CLIENT_SECRET:}
      # Comma-separated exact web callback URIs, also registered in Kakao Developers.
      redirect-uris: ${NURSEFLOW_KAKAO_REDIRECT_URIS:}
    session:
      # HMAC key for NurseFlow access tokens: at least 32 bytes, never committed.
      secret: ${NURSEFLOW_SESSION_SECRET}
      access-token-ttl: 10m
      refresh-token-ttl: 30d
    web:
      login-attempt-ttl: 10m
      # Keep true. Browsers treat http://localhost as secure, so local development still works.
      cookie-secure: ${NURSEFLOW_WEB_COOKIE_SECURE:true}
      # Comma-separated Origins allowed to call /api/v1/auth/web/*. Empty: origins of the redirect URIs.
      allowed-origins: ${NURSEFLOW_WEB_ALLOWED_ORIGINS:}
  hospital:
    hira:
      # data.go.kr key for 건강보험심사평가원 병원정보서비스 (Decoding or Encoding form). Never committed.
      # Empty: GET /api/v1/hospitals/search returns 503 HOSPITAL_SEARCH_NOT_CONFIGURED.
      service-key: ${NURSEFLOW_HOSPITAL_API_KEY:}
      # data.go.kr often answers in several seconds; a 3s limit timed out real searches.
      timeout: 10s
    dataset:
      # Downloaded 「전국 병의원 및 약국 현황」 zip (data.go.kr 15051059, quarterly) or its 병원정보서비스 CSV.
      # Imported at startup when the file changed.
      path: ${NURSEFLOW_HOSPITAL_DATASET_PATH:}
      # Without a path, import the list shipped in the server (src/main/resources/hospitals) unless a newer one is
      # already imported. false and no path: search falls back to the live API above.
      bundled: ${NURSEFLOW_HOSPITAL_DATASET_BUNDLED:true}
  ward:
    # Wards one account may create; protects against scripted mass creation.
    max-created-per-user: ${NURSEFLOW_WARD_MAX_CREATED_PER_USER:5}
  invitation:
    # Page that opens an invitation, e.g. https://<web-host>/invite. The token is appended as #token=...
    link-base-url: ${NURSEFLOW_INVITE_LINK_BASE:}

server:
  port: 8080
