          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /wards/{wardId}/shift-types:
    parameters:
      - $ref: '#/components/parameters/WardId'
    get:
      tags: [Wards]
      operationId: listShiftTypes
      summary: 병동 근무 유형 조회
      description: |
        병동 구성원(관리자·간호사)이 조회한다. 기본은 활성 근무 유형만 반환하며
        `includeInactive=true`이면 비활성 유형도 포함한다. 정렬은 `startTime`, `code` 순이다.
        `policyRevision`은 이 병동의 근무 유형이 바뀔 때마다 1씩 늘어나는 병동 정책 revision이다
        (근무 유형이 한 번도 바뀌지 않았으면 0).
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 근무 유형 목록과 병동 정책 revision
          content:
            application/json:
              schema:
                type: object
                required: [items, policyRevision]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShiftType'
                  policyRevision:
                    type: integer
                    minimum: 0
                    description: 병동 정책 revision. 근무 유형 생성·수정·비활성화·재활성화마다 1 증가한다.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: WARD_NOT_FOUND (병동이 없거나 소속이 아님)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
    post:
      tags: [Wards]
      operationId: createShiftType
      summary: 근무 유형 생성
      description: |
        관리자만 호출할 수 있다. 같은 병동에서 `code`는 비활성 유형을 포함해 유일하다
        (`SHIFT_TYPE_CODE_DUPLICATE`). 서로 다른 유형의 시간대가 겹치는 것은 허용한다.
        `Idempotency-Key`는 받지 않는다. 같은 요청을 재시도하면 `code` 중복으로 409가 된다.
        병동 단위로 직렬화되므로 같은 `code`를 동시에 만들면 하나만 201이다.
      x-required-role: WARD_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftTypeInput'
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WARD_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: SHIFT_TYPE_CODE_DUPLICATE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: |
            INVALID_SHIFT_INTERVAL(시작과 종료가 같음), SHIFT_SPANS_MIDNIGHT_MISMATCH(`spansMidnight`가 시각과 맞지 않음),
            INVALID_SHIFT_MINUTES(인정시간이 근무시간에서 휴게를 뺀 값을 넘음)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

  /wards/{wardId}/shift-types/{shiftTypeId}:
    parameters:
      - $ref: '#/components/parameters/WardId'
      - $ref: '#/components/parameters/ShiftTypeId'
    put:
      tags: [Wards]
      operationId: updateShiftType
      summary: 근무 유형/시간 갱신
      description: |
        관리자만 호출할 수 있는 전체 교체(full update)다. 생략한 선택 필드는 생성과 같은 기본값으로 다시 계산된다.
        `active`를 생략하면 현재 값을 유지하고, `true`로 보내면 비활성 유형을 다시 켠다.
        시간·휴게·인정시간·월 환산시간·종류·`spansMidnight`·활성 여부가 바뀌면 이 유형을 쓰는 DRAFT 근무표는
        `needsRevalidation=true`가 된다. 표시 이름·코드만 바꾸면 표시하지 않는다.
        이미 만들어진 근무 칸의 시각은 바뀌지 않는다. PUBLISHED 근무표는 영향받지 않는다.
      x-required-role: WARD_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftTypeInput'
      responses:
        '200':
          description: 근무 유형 갱신됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WARD_NOT_FOUND 또는 SHIFT_TYPE_NOT_FOUND_IN_WARD
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: SHIFT_TYPE_CODE_DUPLICATE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '422':
          description: INVALID_SHIFT_INTERVAL, SHIFT_SPANS_MIDNIGHT_MISMATCH, INVALID_SHIFT_MINUTES
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
    delete:
      tags: [Wards]
      operationId: deactivateShiftType
      summary: 근무 유형 비활성화
      description: |
        관리자만 호출할 수 있다. 행을 지우지 않고 `active=false`로 바꾼다(근무 칸이 참조하므로 삭제하지 않는다).
        이미 비활성이어도 200이며 변경 없이 현재 값을 반환한다(정책 revision도 늘지 않는다).
        비활성 유형은 새 필요 인원 입력에 쓸 수 없지만(`SHIFT_TYPE_NOT_FOUND`), 기존 근무 칸과 근무표 조회는 그대로다.
        이 유형을 쓰는 DRAFT 근무표는 `needsRevalidation=true`가 된다.
      x-required-role: WARD_ADMIN
      responses:
        '200':
          description: 비활성화된 근무 유형
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WARD_NOT_FOUND 또는 SHIFT_TYPE_NOT_FOUND_IN_WARD
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

