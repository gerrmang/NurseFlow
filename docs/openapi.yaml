        '404':
          $ref: '#/components/responses/NotFound'

  /generation-jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [Generation]
      operationId: cancelGenerationJob
      summary: 진행 중인 자동 배치 취소
      x-required-role: WARD_ADMIN
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 취소 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /rosters/{rosterId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RosterId'
    post:
      tags: [Rosters]
      operationId: confirmAndPublishRoster
      summary: 최신 draft 확정 및 활성 달력에 공개 적용
      description: |
        한 번의 원자적 명령이다. 최신 hard rules와 revision을 재검증한 뒤 PUBLISHED snapshot을 적용한다.
        필요 인원으로 생성된 근무 칸이 하나도 없는 draft는 ROSTER_REQUIREMENTS_REQUIRED 오류로 확정할 수 없다.
        미충원은 허용한다. 미충원이 있으면 관리자는 표시된 부족 인원 수를 확인하고 acknowledgeUnfilledCount에 같은 값을 보내야 한다.
        확정 전에는 새 draft가 간호사 달력에 보이지 않는다. 기존 공개본은 새 snapshot 적용 전까지 유지된다.
      x-required-role: WARD_ADMIN
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRosterRequest'
      responses:
        '200':
          description: 확정되고 활성 달력에 공개 적용된 roster
          headers:
            ETag:
              $ref: '#/components/headers/RosterETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RosterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/RuleViolation'

  /wards/{wardId}/published-rosters:
    parameters:
      - $ref: '#/components/parameters/WardId'
    get:
      tags: [Published calendars]
      operationId: getPublishedWardCalendar
      summary: 병동 전체 공개 달력 조회
      description: |
        병동 membership과 ward-wide view 권한이 있는 사용자만 가능하다.
        승인 부재 레코드, 부재 사유, 관리자 메모는 응답하지 않는다.
        이 응답은 shared/public cache에 저장하지 않는다.
      x-required-role: WARD_MEMBER
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-11'
      responses:
        '200':
          description: 공개된 병동 전체 근무표
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedWardCalendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /wards/{wardId}/published-rosters/mine:
    parameters:
      - $ref: '#/components/parameters/WardId'
    get:
      tags: [Published calendars]
      operationId: getMyPublishedCalendar
      summary: 로그인한 간호사 본인 일정만 조회
      description: |
        nurseId를 요청에서 받지 않는다. 인증 토큰의 subject로 본인 일정을 결정한다.
        응답은 이 사용자에게 배정된 공개 근무만 포함하며 부재 기록/사유는 포함하지 않는다.
      x-required-role: WARD_MEMBER
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
            example: '2026-11'
      responses:
        '200':
          description: 본인의 공개 근무표
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedPersonalCalendar'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: POST /auth/kakao/session 또는 /auth/session/refresh가 발급한 NurseFlow access token. sub는 NurseFlow userId다.
  parameters:
    WebClientHeader:
      name: X-NurseFlow-Client
      in: header
      required: true
      description: |
        웹 인증 경로의 CSRF 방어. 값은 `web`. 사용자 정의 헤더라 다른 사이트의 폼·단순 요청으로는 보낼 수 없다.
        Origin 헤더가 있으면 허용 출처(NURSEFLOW_WEB_ALLOWED_ORIGINS, 비우면 Redirect URI들의 출처)여야 한다.
        출처는 브라우저처럼 기본 포트(https 443, http 80)를 생략해 비교한다.
        허용 출처여도 `Sec-Fetch-Site: cross-site` 요청은 거부한다. 서버는 CORS를 열지 않으며 쿠키는 SameSite=Strict다.
        따라서 웹은 API와 같은 사이트에서 호출해야 한다(같은 도메인, 개발 서버 프록시 또는 단일 리버스 프록시).
        허용 출처 목록에 다른 사이트를 등록해도 교차 사이트 호출은 지원되지 않는다.
      schema:
        type: string
        enum: [web]
    WardId:
      name: wardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RosterId:
      name: rosterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AbsenceId:
      name: absenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NurseId:
      name: nurseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ShiftTypeId:
      name: shiftTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlotId:
      name: slotId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag of the roster revision loaded by the client.
      schema:
        type: string
      example: '"roster-70c0e496-r12"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique UUID per logical mutation; retrying the same key must not duplicate the operation.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    RosterETag:
      description: Strong revision ETag for subsequent If-Match writes.
      schema:
        type: string
  responses:
    BadRequest:
      description: 요청 형식 또는 필드 값 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Unauthorized:
      description: 유효한 access token이 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Forbidden:
      description: 역할 또는 병동 권한 부족
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    NotFound:
      description: 리소스가 없거나 현재 사용자가 접근할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    Conflict:
      description: 중복 roster 또는 상태 충돌
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    PreconditionFailed:
      description: If-Match revision이 최신이 아님
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    RuleViolation:
      description: hard rule 위반 또는 정책상 잘못된 변경
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    TooManyRequests:
      description: 요청 또는 자동 배치 제한 초과
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
    InternalError:
      description: 내부 오류. 민감정보는 응답에 포함하지 않는다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    RedeemInvitationRequest:
      type: object
      additionalProperties: false
      required: [token]
      description: WARD_MEMBER는 가입 시 이 병원에 입사한 년월(YYYY-MM)을 제출해야 한다. 실제 경력 시작일·직급·팀 내 경력 순서는 관리자가 정한다. WARD_ADMIN은 이 값을 받지 않는다.
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
        hospitalJoinedOn:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    InvitationPreview:
      type: object
      required: [wardId, wardName, role, expiresAt, linksExistingNurse]
      properties:
        wardId:
          type: string
          format: uuid
        wardName:
          type: string
        role:
          type: string
          enum: [WARD_ADMIN, WARD_MEMBER]
        expiresAt:
          type: string
          format: date-time
        linksExistingNurse:
          type: boolean
        hospitalName:
          type: [string, 'null']
          description: 병동을 만들 때 고른 병원 이름. 같은 이름의 병동이 여러 병원에 있을 수 있으므로 가입 전 확인용으로 보여준다. 병원 없이 만들어진 이전 병동은 null
          example: 가상대학교병원
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [WARD_ADMIN, WARD_MEMBER]
        nurseId:
          type: string
          format: uuid
          description: WARD_MEMBER가 이어받을 기존 가상 간호사 기록(선택). 없으면 수락 시 새 기록을 만든다.
    Invitation:
      type: object
      required: [invitationId, wardId, role, status, createdAt, expiresAt]
      properties:
        invitationId:
          type: string
          format: uuid
        wardId:
          type: string
          format: uuid
        role:
          type: string
          enum: [WARD_ADMIN, WARD_MEMBER]
        nurseId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, REDEEMED, REVOKED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        redeemedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
    CreatedInvitation:
      type: object
      required: [invitation, token]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: 한 번만 반환. 다시 조회할 수 없다.
        inviteUrl:
          type: string
          format: uri
    KakaoLoginRequest:
      type: object
      additionalProperties: false
      required: [idToken]
      properties:
        idToken:
          type: string
          maxLength: 8192
          description: Kakao OIDC ID 토큰. 서버는 저장하거나 기록하지 않는다.
        nonce:
          type: string
          minLength: 1
          maxLength: 255
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
    Session:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: NurseFlow access JWT (HS256, 기본 10분). 모든 보호 API의 Bearer 토큰.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: 불투명 refresh token (기본 30일). Android는 암호화 저장소에 둔다. 웹은 이 경로 대신 /auth/web/*의 쿠키 방식을 쓴다.
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          type: object
          required: [userId, displayName, newUser]
          properties:
            userId:
              type: string
              format: uuid
            displayName:
              type: string
            newUser:
              type: boolean
    WebKakaoAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [redirectUri]
      properties:
        redirectUri:
          type: string
          maxLength: 2048
          description: 웹 콜백 주소. 서버 허용 목록·Kakao Developers 등록값과 정확히 같아야 한다.
    WebKakaoAuthorization:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl:
          type: string
          description: client_id, redirect_uri, response_type=code, state, nonce가 채워진 Kakao 인가 주소
        expiresAt:
          type: string
          format: date-time
          description: 이 로그인 시도(state)의 만료 시각
    WebKakaoCodeRequest:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code:
          type: string
          maxLength: 2048
          description: Kakao가 Redirect URI의 쿼리로 준 인가 코드. 서버는 저장하거나 기록하지 않는다.
        state:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: Kakao가 Redirect URI로 되돌려준 state 값 그대로
    WebSession:
      type: object
      description: 웹 세션. refresh token은 본문에 없고 HttpOnly 쿠키로만 전달된다.
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshTokenExpiresAt, user]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
        accessToken:
          type: string
          description: NurseFlow access JWT. 웹은 메모리에만 두고 localStorage·sessionStorage에 저장하지 않는다.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        user:
          type: object
          required: [userId, displayName, newUser]
          properties:
            userId:
              type: string
              format: uuid
            displayName:
              type: string
            newUser:
              type: boolean
    CreateWardRequest:
      type: object
      additionalProperties: false
      required: [hospital, wardName]
      properties:
        hospital:
          type: object
          additionalProperties: false
          required: [source, externalId]
          description: 병원 검색 결과의 `source`·`externalId` 그대로
          properties:
            source:
              type: string
              enum: [HIRA]
            externalId:
              type: string
              minLength: 1
              maxLength: 255
        wardName:
          type: string
          minLength: 1
          maxLength: 100
          description: 앞뒤 공백을 제거해 저장한다
          example: 가상 내과 병동
        timeZone:
          type: string
          default: Asia/Seoul
    CurrentUser:
      type: object
      required: [userId, displayName, memberships]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/WardMembership'
    WardMembership:
      type: object
      required: [wardId, wardName, roles, canViewWardCalendar]
      properties:
        wardId:
          type: string
          format: uuid
        wardName:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [WARD_ADMIN, WARD_MEMBER]
        canViewWardCalendar:
          type: boolean
        hospitalName:
          type: [string, 'null']
          description: 병동을 만들 때 고른 병원의 이름(생성 시점 값). 같은 이름의 병동을 구분하는 데 쓴다. 병원 없이 만들어진 이전 병동은 null
          example: 가상대학교병원
    StaffPage:
      type: object
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StaffMember'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
          minimum: 0
    StaffInput:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        qualifications:
          type: array
          maxItems: 50
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 64
        active:
          type: boolean
          default: true
        teamId:
          type: string
          format: uuid
          description: 등록 시에만 사용. 이후 변경은 /staff/{nurseId}/team.
    Team:
      type: object
      required: [teamId, name, sortOrder]
      properties:
        teamId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 50
        sortOrder:
          type: integer
    TeamItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Team'
    TeamInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        sortOrder:
          type: integer
          minimum: 1
          maximum: 1000
    TeamAssignment:
      type: object
      additionalProperties: false
      required: [teamId]
      properties:
        teamId:
          type: [string, 'null']
          format: uuid
    CareerPolicy:
      type: object
      required: [stageThresholdMonths, ranks, isDefault]
      properties:
        stageThresholdMonths:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
          description: 2~5단계의 하한(개월). [12,36,72,120] = 1년 미만 1, 1~3년 2, 3~6년 3, 6~10년 4, 10년 이상 5
        ranks:
          type: array
          items:
            type: string
          description: 직급 이름 목록. 현재 단계 계산에는 쓰지 않는다.
        isDefault:
          type: boolean
    CareerPolicyInput:
      type: object
      additionalProperties: false
      required: [stageThresholdMonths, ranks]
      properties:
        stageThresholdMonths:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 1
            maximum: 600
          description: 엄격히 증가해야 한다.
        ranks:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 30
    CareerProfileInput:
      type: object
      additionalProperties: false
      required: [careerStartedOn, rank]
      description: 관리자가 설정하는 실제 간호 경력 시작 년월과 직급
      properties:
        careerStartedOn:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 실제 간호 경력 시작 년월(YYYY-MM). 병원 입사 년월과 다를 수 있다.
        rank:
          type: string
          maxLength: 30
          description: 병동 직급 목록 중 하나
    HospitalJoinMonthInput:
      type: object
      additionalProperties: false
      required: [hospitalJoinedOn]
      properties:
        hospitalJoinedOn:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 이 병원에 입사한 년월(YYYY-MM). 실제 경력순은 관리자가 팀별로 조정한다.
    CareerProfile:
      type: object
      required: [status, hospitalJoinedOn]
      properties:
        status:
          type: string
          enum: [MISSING, PENDING, CONFIRMED]
          description: 실제 경력 정보의 상태. PENDING은 관리자가 확인하기 전
        hospitalJoinedOn:
          type: [string, 'null']
          description: 이 병원에 입사한 년월
        careerStartedOn:
          type: [string, 'null']
          description: 관리자가 입력한 실제 간호 경력 시작 년월
        rank:
          type: [string, 'null']
        submittedAt:
          type: [string, 'null']
          format: date-time
        confirmedCareerStartedOn:
          type: [string, 'null']
        confirmedRank:
          type: [string, 'null']
        confirmedAt:
          type: [string, 'null']
          format: date-time
        experienceMonths:
          type: [integer, 'null']
          description: 실제 간호 경력 시작 년월부터 병동 기준 이번 달까지 개월 수
        submittedStage:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: 입력값 기준 단계(관리자 확인용, 점수에 사용 안 함)
        scoringStage:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
          description: CONFIRMED일 때만 값이 있으며 팀 경력 구성 점수에 사용
    StaffMember:
      type: object
      required: [nurseId, displayName, qualifications, active, linkedAccount, profile]
      properties:
        nurseId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 100
        qualifications:
          type: array
          items:
            type: string
            maxLength: 64
        active:
          type: boolean
        linkedAccount:
          type: boolean
          description: 초대 수락으로 로그인 계정과 연결됐는지
        team:
          oneOf:
            - $ref: '#/components/schemas/Team'
            - type: 'null'
        profile:
          $ref: '#/components/schemas/CareerProfile'
    ShiftType:
      type: object
      additionalProperties: false
      required: [shiftTypeId, code, displayName, kind, startTime, endTime, spansMidnight, breakMinutes, recognizedMinutes, targetCreditMinutes, durationMinutes, active]
      properties:
        shiftTypeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
        displayName:
          type: string
          maxLength: 64
        kind:
          type: string
          enum: [DAY, EVENING, NIGHT, OTHER]
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 병동 현지 시각 HH:mm
          example: '22:00'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: 병동 현지 시각 HH:mm. `spansMidnight=true`이면 다음 날 시각이다.
          example: '07:00'
        spansMidnight:
          type: boolean
          description: 종료가 다음 날이면 true. `endTime < startTime`과 일치해야 한다.
        durationMinutes:
          type: integer
          minimum: 1
          description: 서버가 계산한 근무 구간 길이(분). 자정을 넘으면 `endTime - startTime + 1440`. 22:00~07:00은 540.
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 240
          description: 휴게 시간(분).
        recognizedMinutes:
          type: integer
          minimum: 1
          description: 실제 인정 근무시간(분). `durationMinutes - breakMinutes` 이하.
        targetCreditMinutes:
          type: integer
          minimum: 0
          description: 월 목표 환산 인정 시간(분). 이 근무 하나가 월 목표 시간에 채워 주는 분. 기본값은 `recognizedMinutes`. 월 목표 계산 자체는 A13에서 다룬다.
        active:
          type: boolean
    ShiftTypeInput:
      type: object
      additionalProperties: false
      required: [code, displayName, kind, startTime, endTime, spansMidnight]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]{1,32}$'
        displayName:
          type: string
          maxLength: 64
        kind:
          type: string
          enum: [DAY, EVENING, NIGHT, OTHER]
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '22:00'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          example: '07:00'
        spansMidnight:
          type: boolean
        breakMinutes:
          type: integer
          minimum: 0
          maximum: 240
          default: 0
        recognizedMinutes:
          type: integer
          minimum: 1
          description: 생략하면 `durationMinutes - breakMinutes`.
        targetCreditMinutes:
          type: integer
          minimum: 0
          description: 생략하면 `recognizedMinutes`.
        active:
          type: boolean
          description: 생성 시 생략하면 true. 수정 시 생략하면 현재 값 유지.
    CreateRosterRequest:
      type: object
      additionalProperties: false
      required: [month]
      properties:
        month:
          type: string
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-11'
    RosterSummary:
      type: object
      required: [rosterId, wardId, month, status, revision, timeZone, staffing]
      properties:
        rosterId:
          type: string
          format: uuid
        wardId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        revision:
          type: integer
          minimum: 1
        timeZone:
          type: string
          description: IANA time zone identifier
          example: Asia/Seoul
        staffing:
          $ref: '#/components/schemas/StaffingSummary'
        publishedAt:
          type: string
          format: date-time
        confirmedBy:
          type: string
          format: uuid
        needsRevalidation:
          type: boolean
          description: |
            이 초안이 쓰는 근무 유형이 바뀌거나 비활성화되어 다시 검증해야 하면 true. PUBLISHED 근무표는 항상 false.
            이 플래그를 지우는 동작은 후속 단위에서 다룬다.
    Roster:
      allOf:
        - $ref: '#/components/schemas/RosterSummary'
        - type: object
          required: [slots]
          properties:
            slots:
              type: array
              items:
                $ref: '#/components/schemas/StaffingSlot'
            diagnostics:
              type: array
              description: 관리자 전용. 미충원/규칙 사유이며 간호사 공개 응답에는 포함하지 않는다.
              items:
                $ref: '#/components/schemas/RuleDiagnostic'
    StaffingSummary:
      type: object
      required: [required, assigned, unfilled, hardRuleViolations]
      properties:
        required:
          type: integer
          minimum: 0
        assigned:
          type: integer
          minimum: 0
        unfilled:
          type: integer
          minimum: 0
        hardRuleViolations:
          type: integer
          const: 0
    StaffingRequirement:
      type: object
      additionalProperties: false
      required: [date, shiftTypeId, requiredCount, requiredQualifications]
      properties:
        date:
          type: string
          format: date
        shiftTypeId:
          type: string
          format: uuid
        requiredCount:
          type: integer
          minimum: 0
          maximum: 100
        requiredQualifications:
          type: array
          items:
            type: string
            maxLength: 64
    ReplaceRequirementsRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/StaffingRequirement'
    StaffingSlot:
      type: object
      required: [slotId, date, shiftTypeId, startAt, endAt, status]
      properties:
        slotId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        shiftTypeId:
          type: string
          format: uuid
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [FILLED, UNFILLED]
        assignment:
          oneOf:
            - $ref: '#/components/schemas/Assignment'
            - type: 'null'
    Assignment:
      type: object
      required: [nurseId, displayName, locked]
      properties:
        nurseId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 100
        locked:
          type: boolean
    ApprovedAbsence:
      type: object
      required: [absenceId, nurseId, kind, startsAt, endsAt]
      properties:
        absenceId:
          type: string
          format: uuid
        nurseId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [APPROVED_LEAVE, APPROVED_HALF_DAY]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    ApprovedAbsenceInput:
      type: object
      additionalProperties: false
      required: [nurseId, kind, startsAt, endsAt]
      properties:
        nurseId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [APPROVED_LEAVE, APPROVED_HALF_DAY]
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    ValidateAssignmentRequest:
      type: object
      additionalProperties: false
      required: [slotId, nurseId]
      properties:
        slotId:
          type: string
          format: uuid
        nurseId:
          type: string
          format: uuid
    AssignmentValidation:
      type: object
      required: [allowed, hardViolations, softWarnings, rosterRevision]
      properties:
        allowed:
          type: boolean
        hardViolations:
          type: array
          items:
            $ref: '#/components/schemas/RuleDiagnostic'
        softWarnings:
          type: array
          items:
            $ref: '#/components/schemas/RuleDiagnostic'
        rosterRevision:
          type: integer
    AssignNurseRequest:
      type: object
      additionalProperties: false
      required: [nurseId]
      properties:
        nurseId:
          type: string
          format: uuid
        locked:
          type: boolean
          default: false
    RuleDiagnostic:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          maxLength: 64
        severity:
          type: string
          enum: [HARD, SOFT]
        message:
          type: string
          maxLength: 500
        affectedDate:
          type: string
          format: date
    StartGenerationRequest:
      type: object
      additionalProperties: false
      required: [preserveLockedAssignments]
      properties:
        preserveLockedAssignments:
          type: boolean
        timeLimitSeconds:
          type: integer
          minimum: 1
          maximum: 600
          default: 120
    GenerationJob:
      type: object
      required: [jobId, rosterId, status, sourceRosterRevision, createdAt]
      properties:
        jobId:
          type: string
          format: uuid
        rosterId:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, RUNNING, COMPLETED, PARTIAL, TIMED_OUT, CANCELLED, FAILED]
        progressPercent:
          type: integer
          minimum: 0
          maximum: 100
        sourceRosterRevision:
          type: integer
        resultRosterRevision:
          type: integer
        staffing:
          $ref: '#/components/schemas/StaffingSummary'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/RuleDiagnostic'
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    ConfirmRosterRequest:
      type: object
      additionalProperties: false
      properties:
        acknowledgeUnfilledCount:
          type: integer
          minimum: 0
          description: 미충원이 있을 때 최신 staffing.unfilled와 일치해야 한다. 미충원 0이면 생략 가능.
    PublishedWardCalendar:
      type: object
      required: [wardId, month, revision, timeZone, staffing, slots]
      properties:
        wardId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        revision:
          type: integer
        timeZone:
          type: string
        staffing:
          $ref: '#/components/schemas/StaffingSummary'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/StaffingSlot'
    PublishedPersonalCalendar:
      type: object
      required: [wardId, month, revision, timeZone, assignments]
      properties:
        wardId:
          type: string
          format: uuid
        month:
          type: string
          pattern: '^\\d{4}-(0[1-9]|1[0-2])$'
        revision:
          type: integer
        timeZone:
          type: string
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/PersonalAssignment'
    PersonalAssignment:
      type: object
      required: [date, shiftType, startsAt, endsAt]
      properties:
        date:
          type: string
          format: date
        shiftType:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    HospitalSearchPage:
      type: object
      required: [items, page, size, totalCount, attribution]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HospitalCandidate'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        totalCount:
          type: integer
          minimum: 0
          description: 조건에 맞는 전체 결과 수
        attribution:
          type: string
          description: 화면에 표시할 데이터 출처(공공누리 제1유형 출처 표시). 복제 목록이면 기준 시점을 포함한다
          example: 건강보험심사평가원 전국 병의원 및 약국 현황 (2026.9. 기준)
    HospitalCandidate:
      type: object
      required: [source, externalId, name, address]
      properties:
        source:
          type: string
          enum: [HIRA]
          description: 데이터 출처. HIRA는 건강보험심사평가원
        externalId:
          type: string
          description: 출처가 발급한 요양기관 식별자(암호화된 요양기관기호). 병동 생성(A4) 때 그대로 보낸다
        name:
          type: string
          example: 가상대학교병원
        address:
          type: string
          example: 서울특별시 가상구 가상로 1
        category:
          type: [string, 'null']
          description: 의료기관 종별(예 상급종합, 종합병원, 병원, 의원). 같은 이름의 기관을 구분하는 데 쓴다
          example: 종합병원
    ApiProblem:
      type: object
      additionalProperties: true
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: 민감정보나 타 사용자 정보를 포함하지 않는 안전한 안내
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          example: REST_AFTER_NIGHT
        traceId:
          type: string
        currentRevision:
          type: integer
        retryable:
          type: boolean
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
        ruleViolations:
          type: array
          items:
            $ref: '#/components/schemas/RuleDiagnostic'
