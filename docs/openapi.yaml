  /invitations/redeem:
    post:
      tags: [Invitations]
      operationId: redeemInvitation
      summary: 초대 수락 — 병동 가입
      description: |
        초대 소진, 병동 소속 생성, (WARD_MEMBER) 간호사 기록 연결 또는 생성을 한 트랜잭션에서 처리한다.
        역할은 초대에 저장된 값만 사용하며 요청에 역할 필드를 넣으면 400이다.
        이미 그 병동 소속인 사용자는 409 ALREADY_WARD_MEMBER이고 초대는 그대로 남는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemInvitationRequest'
      responses:
        '201':
          description: 생성된 병동 소속
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WardMembership'
        '400':
          description: INVALID_REQUEST 또는 WARD_MEMBER 가입에 필요한 HOSPITAL_JOIN_MONTH_REQUIRED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: INVITATION_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '409':
          description: INVITATION_ALREADY_REDEEMED, ALREADY_WARD_MEMBER, NURSE_ALREADY_LINKED 또는 ADMIN_NURSE_RECORD_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
        '410':
          description: INVITATION_EXPIRED 또는 INVITATION_REVOKED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'

